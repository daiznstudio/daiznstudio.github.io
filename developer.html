<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Zain Faisal | daizn studio</title>
<meta name="description" content="Zain Faisal | daizn studio">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23482e74'/%3E%3Cg fill='%23f0f0f0'%3E%3Crect x='34' y='16' width='32' height='36' rx='15'/%3E%3Cpath d='M34 82A16 15 0 0 1 66 82Z' transform='translate(0 -2)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="assets/fonts/timun-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/timun-300.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Timun";font-weight:700;font-style:normal;font-display:block;src:url(assets/fonts/timun-700.woff2) format("woff2"),url(assets/fonts/timun-700.otf) format("opentype")}
@font-face{font-family:"Timun";font-weight:300;font-style:normal;font-display:block;src:url(assets/fonts/timun-300.woff2) format("woff2"),url(assets/fonts/timun-300.otf) format("opentype")}
:root{
  --ink:#101010;--paper:#f0f0f0;--page:#f2f2f2;--card:#fff;--purple:#482e74;--purple-2:#5d3f95;--tint:#b9a5ea;--violet:#3f1c8c;
  --line:rgba(16,16,16,.18);--line-d:rgba(240,240,240,.2);
  --pad:clamp(18px,4vw,56px);
  --font:"Timun","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --t0:1.2s;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;background:var(--page);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 clamp(.95rem,1.05vw,1.06rem)/1.65 var(--font-body);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--purple-2);outline-offset:3px}
.dark :focus-visible,.violet :focus-visible,.nav :focus-visible{outline-color:var(--tint)}
::selection{background:var(--purple);color:var(--paper)}
b,strong{font-weight:700}
svg{display:block}

/* ---------- layout ---------- */
.sec{position:relative;padding:clamp(72px,10vw,140px) var(--pad)}
.wrap{max-width:1360px;margin:0 auto;width:100%}
.dark{background:var(--ink);color:var(--paper)}
.violet{background:var(--purple);color:var(--paper)}
.up{text-transform:uppercase}
.lead{font-size:clamp(1.05rem,1.5vw,1.3rem);line-height:1.6;max-width:44ch}
.small{font-size:.9rem;opacity:.75}

/* ---------- split-letter headings ---------- */
.split .ch{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .01em;margin:-.1em 0}
.split .sp{display:inline-block;width:.28em}
.split i{display:inline-block;font-style:normal;translate:0 118%;transition:translate 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k)*40ms + var(--d,0s))}
.split.in i{translate:0 0}
.gt{display:inline-block;width:max-content;max-width:none;align-self:flex-start;white-space:nowrap;font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:.9;font-size:clamp(2.4rem,12vw,10rem)}
.fu{opacity:0;translate:0 18px;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--t0) + var(--d,0s))}
@keyframes fu{to{opacity:1;translate:0 0}}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:200;background:var(--ink);color:var(--paper);display:grid;place-items:center;pointer-events:none;overflow:hidden;
  animation:ldCut 2s step-end both,ldOut .7s cubic-bezier(.7,0,.2,1) 2s forwards}
@keyframes ldOut{to{translate:0 -100%;visibility:hidden}}
/* hard colour cuts through the brand palette while the logo holds still */
@keyframes ldCut{0%{background:var(--ink);color:var(--paper)}68%{background:var(--purple);color:var(--paper)}79%{background:var(--tint);color:var(--ink)}90%,100%{background:var(--paper);color:var(--purple)}}
.ld{display:flex;align-items:center;gap:clamp(12px,2vw,22px);animation:ldZoom 1s linear 1s both}
@keyframes ldZoom{from{scale:1}to{scale:1.07}}
/* the mark: an outline traces itself, the stroke thickens inward until the shape is solid,
   then it shrinks from the centre of the screen into its place beside the wordmark (--dx set inline) */
.ld-m{height:clamp(46px,8vw,78px);width:auto;overflow:visible;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
  animation:ldMark .45s cubic-bezier(.7,0,.2,1) .65s both}
@keyframes ldMark{from{translate:var(--dx,0) 0;scale:2.3}to{translate:0 0;scale:1}}
.ld-m .s{stroke-dasharray:100;stroke-dashoffset:100;animation:ldDraw .45s cubic-bezier(.6,0,.3,1) .05s forwards,ldFill .3s cubic-bezier(.6,0,.3,1) .42s forwards}
.ld-m .s2{animation-delay:.14s,.48s}
@keyframes ldDraw{to{stroke-dashoffset:0}}
@keyframes ldFill{to{stroke-width:130}}
/* wordmark: letters spring up from flat in a wave, left to right */
.ld-w{display:flex;font-family:var(--font);font-size:clamp(2.4rem,7.5vw,4.8rem);line-height:1;padding:.06em 0}
.ld-w i{display:inline-block;font-style:normal;transform-origin:50% 88%;scale:1.35 .04;opacity:0;
  animation:ldWave .6s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(.82s + var(--k)*.055s)}
.ld-w i.b{font-weight:700}
@keyframes ldWave{12%{opacity:1}to{scale:1 1;opacity:1}}
/* later pages in the same visit get a short version */
.loader.quick{animation:ldOut .75s cubic-bezier(.7,0,.2,1) .3s forwards}
.loader.quick *{animation:none!important}
.loader.quick .ld-m .s{stroke-dashoffset:0;stroke-width:130}
.loader.quick .ld-w i{scale:1 1;opacity:1}

/* ---------- cursor + peek ---------- */
.cur{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--paper);z-index:300;pointer-events:none;display:grid;place-items:center;opacity:0;transition:width .3s,height .3s,margin .3s,opacity .3s}
/* the custom cursor only shows on hover targets (View/Open labels and the process lens); the normal pointer handles the rest */
.cur.on.big,.cur.on.hwc{opacity:1}
.cur.big{width:88px;height:88px;margin:-44px 0 0 -44px;background:var(--paper);box-shadow:0 0 0 1px var(--ink)}
.cur span{font:700 .62rem var(--font);color:var(--ink);text-transform:uppercase;letter-spacing:.06em;opacity:0;transition:opacity .2s}
.cur.big span{opacity:1}
.peek{position:fixed;left:0;top:0;width:min(26vw,340px);aspect-ratio:4/3;z-index:90;pointer-events:none;border-radius:6px;overflow:hidden;opacity:0;scale:.6;transition:opacity .25s,scale .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.peek.on{opacity:1;scale:1}
.peek svg{width:100%;height:100%}

/* ---------- nav ---------- */
.nav{--fg:var(--ink);--bg:var(--paper);--bar:var(--card);position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) 14px;background:var(--bar);color:var(--fg);transition:color .3s,background .3s}
.nav.inv{--fg:var(--paper);--bg:var(--ink);--bar:var(--ink)}
.nav.vio{--bar:var(--purple)}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{height:26px;width:auto;fill:currentColor}
.wm{display:inline-flex;align-items:baseline;line-height:1;letter-spacing:-.02em;font-family:var(--font)}
.wm .th{font-weight:300}.wm .bd{font-weight:700}
.logo .wm{font-size:1.35rem}
.links{position:relative;display:flex;gap:2px;padding:4px;border:1px solid var(--fg);border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);box-shadow:0 10px 26px -12px rgba(72,46,116,.45),inset 0 1px 0 rgba(255,255,255,.4);animation:navIn .8s cubic-bezier(.2,.8,.2,1) both;transition:border-color .3s,background .3s}
.links a{position:relative;z-index:1;padding:.8em 1.15em .44em;border-radius:999px;font:700 .7rem var(--font);text-transform:uppercase;letter-spacing:.06em;transition:color .3s}
.links.js a.on{color:var(--paper)}
.links:not(.js) a.active{background:var(--purple);color:var(--paper)}
.nav-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,var(--purple),#6d49ad);box-shadow:0 8px 18px -6px rgba(72,46,116,.7);opacity:0;transition:transform .5s cubic-bezier(.34,1.35,.5,1),width .5s cubic-bezier(.34,1.35,.5,1),opacity .3s,background .3s}
.nav-ind.show{opacity:1}
.nav.inv .nav-ind,.nav.vio .nav-ind{background:var(--paper);box-shadow:0 8px 18px -6px rgba(0,0,0,.45)}
.nav.inv .links.js a.on,.nav.vio .links.js a.on{color:var(--ink)}
.nbtn{--sw:var(--purple);--swt:var(--paper);position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:.7em;padding:.93em 1.2em .77em 1.5em;border:1px solid var(--fg);border-radius:999px;font:700 .7rem var(--font);text-transform:uppercase;letter-spacing:.06em;background:none;color:var(--fg);cursor:pointer;transition:color .35s,border-color .35s,box-shadow .35s,transform .35s cubic-bezier(.2,.8,.2,1)}
.nbtn::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;background:linear-gradient(135deg,var(--sw),#6d49ad);transform:translateY(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.nbtn::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--sw) 30%,transparent),transparent);transform:skewX(-20deg);animation:nbShine 5s ease-in-out 1.5s infinite}
.nbtn:hover,.nbtn:focus-visible{color:var(--swt);border-color:var(--sw);box-shadow:0 12px 26px -8px rgba(72,46,116,.6);transform:translateY(-2px)}
.nbtn:hover::before,.nbtn:focus-visible::before{transform:translateY(0)}
.nbtn:hover::after{animation:none;opacity:0}
.nbtn .na{flex:none;width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.nbtn:hover .na{transform:translate(3px,-3px)}
.nbtn:hover .na.dn{transform:translateY(3px)}
.nav.inv .nbtn,.nav.vio .nbtn{--sw:var(--paper);--swt:var(--ink)}
@keyframes navIn{from{opacity:0;translate:0 -10px;scale:.96}}
@keyframes nbShine{0%,60%{left:-70%}100%{left:140%}}
@media (prefers-reduced-motion:reduce){.links{animation:none}.nav-ind,.nbtn,.nbtn::before,.nbtn .na{transition:none}.nbtn::after{animation:none;display:none}}
.nav.vio .links{--fg:var(--paper)}
.nav-r{display:flex;align-items:center;gap:10px}
.menu-btn{--sw:var(--purple);--swt:var(--paper);position:relative;overflow:hidden;isolation:isolate;display:none;align-items:center;gap:.6em;height:44px;padding:0 1.15em 0 1.4em;border:1px solid var(--fg);border-radius:999px;background:none;color:var(--fg);cursor:pointer;font:700 .7rem var(--font);text-transform:uppercase;letter-spacing:.06em;transition:color .35s,border-color .35s,box-shadow .35s,transform .35s cubic-bezier(.2,.8,.2,1)}
.menu-btn::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;background:linear-gradient(135deg,var(--sw),#6d49ad);transform:translateY(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.menu-btn::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--sw) 30%,transparent),transparent);transform:skewX(-20deg);animation:nbShine 5s ease-in-out 1.5s infinite}
.menu-btn:active{transform:scale(.96)}
.menu-btn[aria-expanded="true"]{color:var(--swt);border-color:var(--sw);box-shadow:0 12px 26px -8px rgba(72,46,116,.6)}
.menu-btn[aria-expanded="true"]::before{transform:translateY(0)}
.menu-btn[aria-expanded="true"]::after{animation:none;opacity:0}
.menu-btn svg{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.menu-btn span{position:relative;top:.18em}
.menu-btn[aria-expanded="true"] .mi-c{animation:mbSpin .5s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.menu-btn:hover,.menu-btn:focus-visible{color:var(--swt);border-color:var(--sw);box-shadow:0 12px 26px -8px rgba(72,46,116,.6);transform:translateY(-2px)}.menu-btn:hover::before,.menu-btn:focus-visible::before{transform:translateY(0)}.menu-btn:hover::after{animation:none;opacity:0}.menu-btn:hover .mi-o{transform:scaleX(.78)}}
.nav.inv .menu-btn,.nav.vio .menu-btn{--sw:var(--paper);--swt:var(--ink)}
.nav.inv .menu-btn::before,.nav.vio .menu-btn::before,.nav.inv .nbtn::before,.nav.vio .nbtn::before{background:var(--paper)}
@keyframes mbSpin{from{rotate:-90deg;scale:.4}}
@media (prefers-reduced-motion:reduce){.menu-btn,.menu-btn::before,.menu-btn svg{transition:none}.menu-btn::after{animation:none;display:none}.menu-btn .mi-c{animation:none!important}}
.menu-btn .mt-c,.menu-btn .mi-c,.menu-btn[aria-expanded="true"] .mt-o,.menu-btn[aria-expanded="true"] .mi-o{display:none}
.menu-btn[aria-expanded="true"] .mt-c{display:inline}
.menu-btn[aria-expanded="true"] .mi-c{display:block}
.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.menu{position:fixed;inset:0;z-index:90;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:6px;padding:100px var(--pad) 40px;overflow-y:auto;overscroll-behavior:contain;translate:0 -100%;visibility:hidden;transition:translate .75s cubic-bezier(.7,0,.2,1),visibility 0s .75s}
.menu.open{translate:0 0;visibility:visible;transition:translate .75s cubic-bezier(.7,0,.2,1),visibility 0s}
.menu a,.menu button{display:block;text-align:left;background:none;border:0;padding:0;cursor:pointer;font:700 clamp(1.6rem,min(10vw,7.5vh),4.2rem)/1.15 var(--font);text-transform:uppercase}
.menu a[aria-current]{color:var(--tint)}
.menu .sub{margin-top:24px;font:300 1rem var(--font);opacity:.7;text-transform:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.7em;padding:1.17em 1.6em .83em;text-align:center;border:1px solid currentColor;border-radius:4px;font:700 .74rem var(--font);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;background:none;color:inherit;transition:background .3s,color .3s,border-color .3s}
.btn svg{flex:none;margin-top:-.34em;width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dark .btn:hover,.violet .btn:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn.fill{background:var(--purple);color:var(--paper);border-color:var(--purple)}
.btn.fill:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.violet .btn.fill{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.violet .btn.fill:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dark .btn.fill:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- hero (person) ---------- */
.hero{position:relative;min-height:max(100svh,680px);padding:0 var(--pad);overflow:hidden}
.hword{position:absolute;left:var(--pad);right:var(--pad);top:37%;z-index:1;will-change:translate}
.hword h1{display:inline-block;width:max-content;white-space:nowrap;margin:0;font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:.85;font-size:clamp(2.4rem,9vw,9rem)}
.fig{position:absolute;left:50%;bottom:0;z-index:2;height:80%;translate:calc(-50% + var(--px,0px)) var(--py,0px);pointer-events:none;animation:figIn 1.3s cubic-bezier(.2,.8,.2,1) calc(var(--t0) + .1s) both,figBob 6.5s ease-in-out calc(var(--t0) + 1.5s) infinite}
.fig svg,.fig img{height:100%;width:auto;fill:var(--purple);object-fit:contain;filter:drop-shadow(0 22px 28px rgba(16,16,16,.14))}
@keyframes figIn{from{translate:calc(-50% + var(--px,0px)) 14%;opacity:0}to{translate:calc(-50% + var(--px,0px)) var(--py,0px);opacity:1}}
@keyframes figBob{0%,100%{scale:1}50%{scale:1.012}}
@media (prefers-reduced-motion:reduce){.fig{animation:figIn .01s linear both}}
.hello{position:absolute;left:var(--pad);bottom:clamp(30px,7vh,70px);z-index:3;max-width:min(400px,38vw);font-family:var(--font);font-weight:300;font-size:clamp(.92rem,1.15vw,1.1rem);line-height:1.6;letter-spacing:.01em}
.hello b{font-weight:700;text-transform:uppercase}
.hstats{position:absolute;right:var(--pad);bottom:clamp(30px,7vh,70px);z-index:3;display:grid;gap:20px;text-align:right}
.hstats b{display:block;font-family:var(--font);font-size:clamp(1.8rem,3.4vw,3rem);line-height:1;font-weight:700}
.hstats span{font-family:var(--font);font-size:.85rem;opacity:.75}
.hint{position:absolute;left:50%;bottom:22px;translate:-50% 0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;font:700 .62rem var(--font);text-transform:uppercase;letter-spacing:.1em}
.hint i{width:1px;height:38px;background:var(--ink);transform-origin:top;animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{scale:1 0}50%{scale:1 1}100%{scale:1 0;translate:0 38px}}

/* ---------- hero (company) ---------- */
.hero-co{position:relative;min-height:max(100svh,680px);padding:0 var(--pad);overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.co-top{position:absolute;left:var(--pad);right:var(--pad);top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;justify-content:space-between;gap:20px;font-size:clamp(.9rem,1.1vw,1.05rem)}
.co-top p{max-width:26ch}
.co-word{position:relative;z-index:1;will-change:translate}
.co-word h1{display:inline-block;width:max-content;white-space:nowrap;font-family:var(--font);font-size:clamp(3rem,20vw,16rem);line-height:.82;letter-spacing:-.03em}
.co-word .split .ch{padding:.14em .01em;margin:-.14em 0}
.co-word h1 .t i{font-weight:300}
.co-word h1 .b i{font-weight:700}
.studio{display:flex;justify-content:space-between;width:100%;margin-top:.5em;font-size:calc(var(--fit,100px)*.14);font-weight:300;line-height:1;text-transform:lowercase;padding-right:.05em}
.studio span{display:inline-block;translate:0 130%;overflow:visible;transition:translate .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k)*70ms + .6s)}
.studio-w{overflow:hidden;padding-bottom:.15em}
.hero-co.in .studio span{translate:0 0}
.cobr{display:flex;align-items:center;gap:16px}
.co-badge{width:64px;aspect-ratio:1;background:var(--purple);display:grid;place-items:center;border-radius:4px;animation:float 7s ease-in-out infinite;flex:none}
.co-badge svg{height:56%;width:auto;fill:var(--paper)}
@keyframes float{50%{translate:0 -14px;rotate:3deg}}
.co-bot{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(26px,5vh,54px);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}


/* ---------- company hero: giant word, headline, burst ---------- */
.h2c{position:relative;min-height:max(100svh,680px);overflow:hidden;background-color:var(--page);background-image:repeating-linear-gradient(90deg,rgba(16,16,16,.06) 0 1px,transparent 1px calc(100% / 12))}
.h2c #burst{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.gw{position:absolute;left:50%;top:54%;z-index:1;translate:calc(-50% + var(--gx,0px)) -50%;white-space:nowrap;color:var(--tint);font-size:34vw;line-height:.8;letter-spacing:-.03em;pointer-events:none;user-select:none;will-change:translate}
.gw.split .ch{padding:.16em .01em;margin:-.16em 0}
.gw .t i{font-weight:300}.gw .b i{font-weight:700}
.hl{position:absolute;left:0;right:0;top:50%;translate:0 -50%;z-index:2;text-align:center;padding:0 var(--pad);pointer-events:none}
.hl h1{margin:0;font-weight:700;font-size:clamp(1.3rem,3.6vw,3.5rem);line-height:1.14;letter-spacing:-.02em;text-wrap:balance}

/* ---------- statement flow: build cards ---------- */
.st-flow{margin-top:clamp(40px,5vw,76px)}
.sf-head{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.sf-note{margin:0;font-size:.86rem;opacity:.6}
.sf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.2vw,16px);list-style:none;margin:0;padding:0}
.sf-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;min-height:clamp(280px,23vw,330px);padding:clamp(20px,2vw,28px);border-radius:18px;background:var(--card);border:1px solid rgba(16,16,16,.08);opacity:0;translate:0 40px;transition:opacity .7s cubic-bezier(.2,.8,.2,1) calc(var(--k)*120ms),translate .8s cubic-bezier(.2,.8,.2,1) calc(var(--k)*120ms),background .45s,color .45s,border-color .45s}
.st-flow.in .sf-card{opacity:1;translate:0 0}

.sf-card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--tint));scale:0 1;transform-origin:left;transition:scale .9s cubic-bezier(.2,.8,.2,1) calc(var(--k)*220ms + .4s)}
.st-flow.in .sf-card::after{scale:1 1}
.sf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sf-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--page);color:var(--purple);transition:background .45s,color .45s,rotate .6s cubic-bezier(.2,.8,.2,1)}
.sf-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sf-n{font:700 .7rem/1 var(--font);letter-spacing:.08em;color:var(--purple);transition:color .45s}
.sf-live{display:inline-flex;align-items:center;gap:.5em;margin-left:auto;margin-right:10px;padding:.55em .8em .45em;border-radius:999px;background:rgba(47,191,113,.12);color:#1e8a50;font:700 .54rem/1 var(--font);text-transform:uppercase;letter-spacing:.08em}

.sf-card{container-type:inline-size}

.sf-card:hover{background:var(--purple);border-color:var(--purple);color:var(--paper)}

.ab-photo.ap{background:#1c1030;--px:0;--py:0}

  /* ---------- artwork in the brand palette ---------- */

  let uid = 0;
  const win = (t, inner, x, y, w, h) => `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="9" fill="${t.win}"/><rect width="${w}" height="20" rx="9" fill="${t.fg}" fill-opacity=".09"/><circle cx="12" cy="10" r="3" fill="${t.fg}" fill-opacity=".45"/><circle cx="23" cy="10" r="3" fill="${t.fg}" fill-opacity=".3"/><circle cx="34" cy="10" r="3" fill="${t.fg}" fill-opacity=".2"/>${inner}</g>`;
  const rect = (x, y, w, h, r, f, o) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" fill-opacity="${o}"/>`;

  function mock(kind, t, seed) {
    const F = t.fg; let s = "", i;
    switch (kind) {
      case "dash":

      case "shop":

      case "motion":
        return `<g transform="translate(45 40)"><rect width="230" height="132" rx="8" fill="${t.win}"/><circle cx="115" cy="52" r="24" fill="${F}"><animate attributeName="r" values="24;27;24" dur="2.4s" repeatCount="indefinite"/></circle><path d="M107 40L129 52L107 64Z" fill="${t.win}"/>` + rect(16, 104, 198, 5, 2.5, F, .25) + rect(16, 104, 96, 5, 2.5, F, .8) + [46, 96, 150, 196].map(x => `<rect x="${x - 5}" y="102" width="10" height="10" rx="1.5" fill="${F}" transform="rotate(45 ${x} 107)"/>`).join("") + `<rect x="16" y="94" width="3" height="26" rx="1.5" fill="${F}"><animate attributeName="x" from="16" to="212" dur="4s" repeatCount="indefinite"/></rect></g>`;
      case "campaign":
        return `<g transform="translate(40 30)"><rect width="240" height="160" rx="10" fill="${t.win}"/>` + rect(16, 16, 70, 7, 3.5, F, .5) + rect(16, 32, 96, 18, 4, F, .95) + `<polygon points="16,142 56,128 96,134 136,106 176,88 208,62 224,42 224,142" fill="${F}" fill-opacity=".13"/><polyline points="16,142 56,128 96,134 136,106 176,88 208,62 224,42" fill="none" stroke="${F}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="42" r="6" fill="${F}"><animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/></circle></g>`;
      default: // code
        for (i = 0; i < 9; i++) s += rect(14 + (i % 3) * 14, 30 + i * 14, 50 + ((i * 53 + seed * 7) % 120), 6, 3, F, [.9, .55, .35][i % 3]);

  }

  function abstract(kind, t, id, seed) {
    const defs = `<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.ac}"/><stop offset="1" stop-color="${t.b}"/></linearGradient><radialGradient id="${id}r" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="${t.ac}"/><stop offset="1" stop-color="${t.b}"/></radialGradient>`;
    let s = "";
    if (kind === "orbs") {
      s = `<circle cx="120" cy="124" r="74" fill="url(#${id}r)"/><circle cx="214" cy="92" r="52" fill="url(#${id}r)" opacity=".92"/><circle cx="252" cy="160" r="34" fill="url(#${id}r)" opacity=".85"/>`;
    } else if (kind === "pillars") {
      s = [[74, 150], [140, 120], [206, 170]].map((p, i) => `<ellipse cx="${p[0] + 30}" cy="206" rx="34" ry="6" fill="#000" opacity=".25"/><rect x="${p[0]}" y="${206 - p[1]}" width="60" height="${p[1]}" rx="30" fill="url(#${id}s)" opacity="${1 - i * .1}"/>`).join("");
    } else if (kind === "waves") {
      for (let i = 0; i < 28; i++) { const h = 24 + (Math.sin(i * .5 + seed) * .5 + .5) * 130; s += `<rect x="${24 + i * 10}" y="${110 - h / 2}" width="6" height="${h}" rx="3" fill="url(#${id}s)"/>`; }
    } else if (kind === "petals") {
      for (let i = 0; i < 14; i++) s += `<rect x="150" y="30" width="20" height="82" rx="10" fill="url(#${id}s)" opacity="${.35 + (i % 5) * .13}" transform="rotate(${i * (360 / 14)} 160 110)"/>`;
    } else { // rings
      for (let i = 0; i < 7; i++) s += `<ellipse cx="160" cy="110" rx="${110 - i * 12}" ry="${44 - i * 3}" fill="none" stroke="${t.ac}" stroke-width="3" opacity="${.9 - i * .1}" transform="rotate(${-20 + i * 9} 160 110)"/>`;
    }
    return `<defs>${defs}</defs>${s}`;
  }

  const ABS = ["orbs", "pillars", "waves", "petals", "rings"];
  P.art = (kind, tone, seed, mode) => {
    seed = seed || 0;
    const t = TONES[((tone || 0) % 4 + 4) % 4], id = "a" + (++uid);
    const body = ABS.includes(kind) ? abstract(kind, t, id, seed) : mock(kind, t, seed);
    return `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid ${mode === "meet" ? "meet" : "slice"}" aria-hidden="true"><defs><linearGradient id="${id}b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="220"><stop offset="0" stop-color="${t.a}"/><stop offset="1" stop-color="${t.b}"/></linearGradient></defs><rect x="-600" y="-600" width="1520" height="1420" fill="url(#${id}b)"/>${body}</svg>`;
  };

  /* ---------- text helpers ---------- */
  const letters = (s, extra) => Array.from(s).map((c, i) => c === " " ? `<span class="sp"></span>` : `<span class="ch ${extra || ""}"><i style="--k:${i}">${esc(c)}</i></span>`).join("");

  const words = s => s.split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join(" ");

  /* ---------- sections ---------- */
  P.hero = D => `<section class="hero" id="home" data-nav="home">
    <div class="hword" id="hword"><h1 class="fit split" aria-label="${esc(D.word)}">${letters(D.word)}</h1></div>
    <div class="fig">${D.heroPhoto ? `<img src="${esc(D.heroPhoto)}" alt="${esc(D.name)}">` : P.mono()}</div>
    <p class="hello fu" style="--d:.15s">Hello, I'm <b>${esc(D.name)}</b>, ${esc(D.role)}</p>
    <div class="hstats fu" style="--d:.3s">${D.stats.map(s => `<div><b data-count="${s.n}" data-suffix="${esc(s.s || "")}">0</b><span>${esc(s.l)}</span></div>`).join("")}</div>
</section>`;

  P.heroCo = D => `<section class="hero-co" id="home" data-nav="home">
    <div class="co-top fu" style="--d:.1s"><p>${esc(D.tag)}</p><p>${esc(D.tag2 || "")}</p></div>

      <div class="studio-w"><div class="studio" aria-hidden="true">${"studio".split("").map((c, i) => `<span style="--k:${i}">${c}</span>`).join("")}</div></div></div>
    <div class="co-bot fu" style="--d:.35s"><div class="btns"><a class="btn fill" href="#team">Meet the team ${IC.right}</a><a class="btn" href="#works">See our work</a></div><div class="cobr"><p class="small">${esc(D.scrollNote || "Scroll to explore")}</p><div class="co-badge" aria-hidden="true">${P.mono()}</div></div></div></section>`;

  P.heroCo2 = D => {
    const chips = [{ k: "designer", ic: "pen", l: "Design" }, { k: "designer", ic: "mega", l: "Social media" }, { k: "developer", ic: "code", l: "Software" }];
    let wi = 0;
    const line = s => `<span class="ln">${s.split(" ").map(w => `<span class="w"><i style="--k:${wi++}">${esc(w)}</i></span>`).join(" ")}</span>`;
    return `<section class="h2c" id="home" data-nav="home">
      <canvas id="burst" aria-hidden="true"></canvas>
      <div class="gw split" aria-hidden="true">${letters("dai", "t")}${letters("zn", "b").replace(/--k:(\d)/g, (m, n) => `--k:${+n + 3}`)}</div>

  P.heroCo3 = D => {

    return `<section class="h3" id="home" data-nav="home">
      <div class="h3-photo">${D.heroImage ? `<img src="${esc(D.heroImage)}" alt="">` : `<div class="h3-slot">${img}<span>Your photo goes here</span></div>`}</div>
      ${sh}
      <div class="h3-text"><h1>${esc(T.before)}<b>${esc(T.bold)}</b>${esc(T.after)}</h1></div>
      <div class="h3-badges"><a class="h3-b" ${P.linkAttrs(D, "designer")}><small>Portfolio</small><b>Designer</b>${IC.up}</a><a class="h3-b" ${P.linkAttrs(D, "developer")}><small>Portfolio</small><b>Developer</b>${IC.up}</a></div></section>`;
  };

  /* burst + drifting dots + giant word behaviour for the company hero */
  P.heroBurst = () => {
    const host = $(".h2c"); if (!host) return;
    const cv = $("#burst"), ctx = cv.getContext("2d"), gw = $(".gw"), chips = $$(".oc", host);
    const N = 168, L = Array.from({ length: N }, (_, i) => ({ a: i / N * Math.PI * 2, len: .5 + .5 * Math.random(), ph: Math.random() * 6.28, sp: .0006 + Math.random() * .0012 }));
    const dots = Array.from({ length: 18 }, () => ({ x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .00006, vy: (Math.random() - .5) * .00006, r: 1.3 + Math.random() * 1.6, c: Math.random() < .35 ? "72,46,116" : "16,16,16" }));
    let W = 0, H = 0, dpr = 1, mx = -9999, my = -9999, tx = .5, ty = .5, px = .5, py = .5, hover = false, orbT = 0, last = 0;
    const born = performance.now() + 1500;
    function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = host.clientWidth; H = host.clientHeight; cv.width = W * dpr; cv.height = H * dpr; fitGW(); }
    function fitGW() {
      if (!W) return;
      gw.style.fontSize = "100px";
      const w = gw.getBoundingClientRect().width; if (!w) return;
      gw.style.fontSize = (100 * W * (W < 700 ? 1.65 : 1.14) / w).toFixed(1) + "px";
    }
    host.addEventListener("pointermove", e => { if (e.pointerType === "touch") return; const r = host.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; tx = mx / W; ty = my / H; });
    host.addEventListener("pointerleave", () => { mx = my = -9999; tx = ty = .5; });
    chips.forEach(c => { c.addEventListener("pointerenter", () => hover = true); c.addEventListener("pointerleave", () => hover = false); });
    const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
    function frame(t) {
      requestAnimationFrame(frame);
      if (!W || scrollY > H * 1.1) return;
      const dt = Math.min(50, t - (last || t)); last = t;
      px += (tx - px) * .06; py += (ty - py) * .06;
      const grow = ease((t - born) / 1800);
      // giant word: slides with scroll and a touch of cursor parallax
      gw.style.setProperty("--gx", (-scrollY * .14 + (px - .5) * -46).toFixed(1) + "px");
      // canvas
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const cx0 = W / 2 + (px - .5) * 26, cy0 = H * .5 + (py - .5) * 18, R = Math.min(W, H) * .43, r0 = R * .18;
      const rot = t * .00003, ang = Math.atan2(my - cy0, mx - cx0), near = mx < -9000 ? 0 : Math.max(0, 1 - Math.hypot(mx - cx0, my - cy0) / (R * 2.4));
      ctx.lineWidth = 1;
      for (const l of L) {
        const a = l.a + rot; let d = Math.abs(Math.atan2(Math.sin(a - ang), Math.cos(a - ang)));
        const len = l.len * (.82 + .18 * Math.sin(t * l.sp + l.ph)) + near * Math.exp(-Math.pow(d / .5, 2)) * .6;
        const r1 = r0 + (R - r0) * len * grow;
        ctx.strokeStyle = `rgba(72,46,116,${(.3 + .45 * l.len).toFixed(2)})`;
        ctx.beginPath(); ctx.moveTo(cx0 + Math.cos(a) * r0, cy0 + Math.sin(a) * r0); ctx.lineTo(cx0 + Math.cos(a) * r1, cy0 + Math.sin(a) * r1); ctx.stroke();
      }
      for (const o of dots) {
        o.x += o.vx * dt; o.y += o.vy * dt; if (o.x < 0) o.x = 1; if (o.x > 1) o.x = 0; if (o.y < 0) o.y = 1; if (o.y > 1) o.y = 0;
        let x = o.x * W, y = o.y * H; const dx = x - mx, dy = y - my, dd = Math.hypot(dx, dy);
        if (dd < 140) { x += dx / dd * (140 - dd) * .35; y += dy / dd * (140 - dd) * .35; }
        ctx.fillStyle = `rgba(${o.c},${(.75 * grow).toFixed(2)})`; ctx.beginPath(); ctx.arc(x, y, o.r, 0, 6.283); ctx.fill();
      }

      <div class="lc-head"><p class="sf-cap">/ contact us</p><h2 class="lc-h" id="lc-h" data-lc-wave aria-label="Let's create">Let's<br>create</h2></div>
      <div class="lc-body"><p class="lc-lead">${esc(D.contact.lead)}</p>
        <a class="lc-btn" href="mailto:${esc(D.email)}"><span class="lc-btn-t">Contact us</span><span class="lc-btn-i" aria-hidden="true">${IC.up}</span></a></div>
      <form class="lc-form" id="cform"><p class="sf-cap">/ send a message</p><div class="lc-art" aria-hidden="true">${P.mono()}</div>
        <label class="field"><span>First name</span><input name="fname" type="text" placeholder="Your name" autocomplete="given-name" required maxlength="80"></label>
        <label class="field"><span>Email address</span><input name="email" type="email" placeholder="you@example.com" autocomplete="email" required maxlength="120"></label>
        <label class="field"><span>Message</span><textarea name="msg" rows="3" placeholder="Tell us about your project" required minlength="10" maxlength="4000"></textarea></label>
        <input class="lc-hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="lc-btn" type="submit"><span class="lc-btn-t">Submit message</span><span class="lc-btn-i" aria-hidden="true">${IC.up}</span></button>
        <p class="lc-status" role="status" aria-live="polite"></p></form>
    </div></section></div>
    ${P.footer(D)}`;
  /* footer: full-height black panel with copy-mail and next-page cards, link columns and a giant wordmark.
     Styles and behaviour live in assets/footer.css and assets/footer.js, shared with the legal pages. */
  P.footer = D => {
    const here = (location.pathname.split("/").pop() || "index").replace(/\.html$/, "");
    const next = { team: ["Studio home", "index.html"] }[here] || ["Meet the team", "team.html"];
    const icon = `<svg class="sf-ic" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21.5" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M18 30 30 18M20 18h10v10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const col = (cls, h, items) => `<div class="sf-col ${cls}"><p class="sf-cap sf-dim">${esc(h)}</p><ul>${items.map(([t, u, ext]) => `<li><a class="sf-line" href="${esc(u)}"${ext ? ` target="_blank" rel="noopener"` : ""}>${esc(t).replace("@", "@<wbr>")}</a></li>`).join("")}</ul></div>`;
    return `<footer class="sf dark" data-sf data-nav="contact"><div class="sf-in">
      <div class="sf-cards">
        <a class="sf-card mail" href="mailto:${esc(D.email)}" data-sf-copy="${esc(D.email)}" aria-label="Copy email address ${esc(D.email)}"><div class="sf-card-top"><p class="sf-cap">/ Copy mail</p><p class="sf-sub">Prefer mail?</p></div>
          <div class="sf-card-bot"><span class="sf-big">${esc(D.email).replace("@", "@<wbr>")}</span>${icon}</div></a>
        <a class="sf-card next" href="${next[1]}"><div class="sf-card-top"><p class="sf-cap">/ Navigation</p><p class="sf-sub">Go to next page</p></div>
          <div class="sf-card-bot"><span class="sf-big">${esc(next[0])}</span>${icon}</div></a></div>
      ${col("sf-nav", "Navigation", D.navLinks.map(l => [l.t, l.h]))}
      ${col("sf-soc", "Socials", D.socials.filter(s => s.i !== "mail").map(s => [s.n, s.u, true]))}
      ${col("sf-leg", "Legal", [["Legal", "legal.html"], ["Privacy policy", "privacy.html"], ["Terms and conditions", "terms.html"]])}
      ${col("sf-con", "Connect", [[D.email, "mailto:" + D.email]].concat(D.phone ? [[D.phone, "tel:" + D.phone.replace(/\s+/g, "")]] : []))}
      <a class="sf-logo" href="index.html" aria-label="daizn studio home">${P.mono()}${P.wm()}</a>
      <div class="sf-copy"><p class="sf-cap sf-dim">&copy;<span class="sf-yr">${year}</span> daizn studio, all rights reserved</p><a class="sf-cap sf-dim sf-line" href="#home">Back to top</a></div>
    </div></footer>`;
  };

  /* ---------- modal ---------- */
  const X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  // shrink a pop-up title just enough that its longest word fits on one line (long names like NATUREDROPS)
  const fitCtx = document.createElement("canvas").getContext("2d");
  P.fitTitle = h => {
    if (!h) return;
    h.style.fontSize = "";
    const cs = getComputedStyle(h), size = parseFloat(cs.fontSize), avail = h.clientWidth;
    fitCtx.font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    fitCtx.letterSpacing = cs.letterSpacing === "normal" ? "0px" : cs.letterSpacing;
    const widest = Math.max(...h.textContent.toUpperCase().split(/\s+/).map(w => fitCtx.measureText(w).width));
    if (avail && widest > avail) h.style.fontSize = (size * avail / widest * .97).toFixed(2) + "px";
  };
  addEventListener("resize", () => P.fitTitle($("#modal .mx-info h3")));
  P.showModal = html => {
    const m = $("#modal");
    m.innerHTML = `<button class="m-close" aria-label="Close">${X}</button>${html}`;
    m.classList.toggle("mxd", html.includes('class="mx '));
    if (typeof m.showModal === "function") m.showModal(); else m.setAttribute("open", "");
    P.fitTitle($(".mx-info h3", m));
    P.bindViewer(m);
  };
  P.modalHTML = (p, i, buttons) => {
    const G = p.gallery || [], two = n => String(n).padStart(2, "0"), chev = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
    return `<div class="mx dark" data-cover="${esc(p.cover || (G[0] ? G[0][0] : p.video ? p.video + "/poster.webp" : ""))}">
      <div class="mx-stage">
        ${G.length ? `<img class="mx-amb" src="${esc(G[0][0])}" alt="" aria-hidden="true">` : ""}
        <div class="mx-view">${G.length ? `<img src="${esc(G[0][0])}" alt="${esc(p.t)}, image 1 of ${G.length}">` : P.art(p.kind, p.tone == null ? i : p.tone, i, "meet")}</div>
        ${G.length > 1 ? `<div class="mx-top"><div class="mx-count"><b>01</b> / ${two(G.length)}</div><div class="mx-prog"><i style="--p:${(1 / G.length).toFixed(4)}"></i></div></div>
        <button class="mx-nav prev" aria-label="Previous image">${chev("M15 5l-7 7 7 7")}</button><button class="mx-nav next" aria-label="Next image">${chev("M9 5l7 7-7 7")}</button>
        <div class="mx-strip">${G.map((g, k) => `<button class="mx-th${k ? "" : " on"}" data-src="${esc(g[0])}" aria-label="Show image ${k + 1}"><img src="${esc(g[0])}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      </div>
      <aside class="mx-info">
        <p class="mx-eye">${esc(p.cat)}</p><h3>${esc(p.t)}</h3><p class="mx-desc">${esc(p.s)}</p>
        <div class="mx-meta"><span><small>Year</small>${esc(p.year)}</span><span><small>${G.length ? "Images" : "Type"}</small>${G.length ? G.length : esc(p.cat)}</span></div>
        <ul class="mx-feats">${p.feats.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
        <div class="mx-tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
        <div class="mx-btns">${buttons || ""}</div>
      </aside></div>`;
  };

  /* viewer: arrows, thumbnails, keyboard and swipe */
  P.bindViewer = m => {
    const x = $(".mx", m); if (!x) return;
    const img = $(".mx-view>img", x), ths = $$(".mx-th", x), cnt = $(".mx-count b", x), strip = $(".mx-strip", x), amb = $(".mx-amb", x), prog = $(".mx-prog i", x);
    if (!img || ths.length < 2) return;
    let k = 0;
    const go = n => {
      x.style.setProperty("--dir", n < k ? -1 : 1);
      k = (n + ths.length) % ths.length;
      if (prog) prog.style.setProperty("--p", ((k + 1) / ths.length).toFixed(4));
      ths.forEach((t, j) => t.classList.toggle("on", j === k));
      strip.scrollTo({ left: ths[k].offsetLeft - (strip.clientWidth - ths[k].offsetWidth) / 2, behavior: reduce ? "auto" : "smooth" });
      cnt.textContent = String(k + 1).padStart(2, "0");
      const src = ths[k].dataset.src, pre = new Image(); pre.src = src;
      img.classList.add("out"); if (amb) amb.classList.add("out");
      const swap = () => { img.src = src; img.alt = img.alt.replace(/image \d+/, "image " + (k + 1)); if (amb) amb.src = src; requestAnimationFrame(() => { img.classList.remove("out", "in"); void img.offsetWidth; img.classList.add("in"); if (amb) amb.classList.remove("out"); }); };
      setTimeout(() => (pre.decode ? pre.decode() : Promise.resolve()).then(swap, swap), reduce ? 0 : 180);
    };
    $(".mx-nav.prev", x).onclick = () => go(k - 1);
    $(".mx-nav.next", x).onclick = () => go(k + 1);
    ths.forEach((t, j) => { t.onclick = () => go(j); });
    if (m._key) removeEventListener("keydown", m._key);
    m._key = e => { if (!m.open || !$(".mx", m)) return; if (e.key === "ArrowRight") go(k + 1); else if (e.key === "ArrowLeft") go(k - 1); };
    addEventListener("keydown", m._key);
    const view = $(".mx-view", x); let sx = null;
    view.onpointerdown = e => { sx = e.clientX; };
    view.onpointerup = e => { if (sx !== null && Math.abs(e.clientX - sx) > 40) go(k + (e.clientX < sx ? 1 : -1)); sx = null; };
  };
  P.openWork = (D, i) => {
    const p = D.works.items[i];
    const b = (p.live ? `<a class="btn fill" target="_blank" rel="noopener" href="${esc(p.live)}">${esc(p.liveLabel || "Live demo")} ${IC.up}</a>` : "") + (p.repo ? `<a class="btn" target="_blank" rel="noopener" href="${esc(p.repo)}">${esc(p.repoLabel || "Source code")}</a>` : "");
    P.showModal(P.modalHTML(p, i, b));
  };

  /* ---------- toast / copy / share ---------- */
  let toastT;
  P.toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3000); };
  P.copy = (text, ok) => {
    const fb = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0";
      document.body.appendChild(ta); ta.select(); let good = false; try { good = document.execCommand("copy"); } catch (e) { } ta.remove();
      P.toast(good ? ok : "Copy failed. Copy it from the address bar instead.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => P.toast(ok), fb); else fb();
  };
  P.share = D => {
    const url = location.href;
    if (navigator.share) navigator.share({ title: document.title, text: D.name, url }).catch(e => { if (!e || e.name !== "AbortError") P.copy(url, "Link copied. Send it to anyone."); });
    else P.copy(url, "Link copied. Send it to anyone.");
  };

  /* ---------- text fitting ---------- */
  /* empty space the font leaves before the first and after the last letter, in px at 100px */
  let inkCtx;
  function bearings(el) {
    const t = el.textContent.trim().toUpperCase(); if (!t) return { l: 0, r: 0 };
    const cs = getComputedStyle(el);
    inkCtx = inkCtx || document.createElement("canvas").getContext("2d");
    inkCtx.font = `${cs.fontWeight} 100px ${cs.fontFamily}`;
    const a = inkCtx.measureText(t[0]), z = inkCtx.measureText(t[t.length - 1]);
    const ch = 1; // .split .ch horizontal padding (.01em)
    return { l: -a.actualBoundingBoxLeft + ch, r: z.width - z.actualBoundingBoxRight + (parseFloat(cs.letterSpacing) || 0) + ch };
  }
  function fit(el) {
    const box = el.parentElement; if (!box || !box.clientWidth) return;
    const cs = getComputedStyle(box), avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    el.style.fontSize = "100px"; el.style.marginLeft = "";
    const w = el.getBoundingClientRect().width; if (!w) return;
    // the footer name is sized to its visible letters so it lines up with the text edges above and below it
    const ink = box.classList.contains("bigname") ? bearings(el) : { l: 0, r: 0 };
    const size = 100 * avail / (w - ink.l - ink.r);
    el.style.fontSize = size.toFixed(2) + "px";
    if (ink.l) el.style.marginLeft = (-ink.l * size / 100).toFixed(2) + "px";
    box.style.setProperty("--fit", size.toFixed(2) + "px");
  }

  /* ---------- init ---------- */
  P.init = D => {
    document.title = D.title;
    const logo = $("#logo");
    if (D.self !== "company" && D.links && D.links.company) { logo.href = D.links.company; logo.target = "_blank"; logo.rel = "noopener"; }

    // intro
    const heroEls = $$(".hero .split, .hero-co .split, .hero-co, .h2c .split, .h2c");
    const start = () => heroEls.forEach(e => e.classList.add("in"));
    if (reduce) start(); else setTimeout(start, $(".loader.quick") ? 700 : 2300);

    // fit text once fonts are ready
    const fitAll = () => $$(".fit").forEach(fit);
    fitAll();
    if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("700 100px Timun"), document.fonts.load("300 100px Timun")]).catch(() => { }).then(() => { fitAll(); document.fonts.ready.then(fitAll); });
    let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(fitAll, 120); });

    // headings reveal in view
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .25 });
      $$(".split").forEach(el => { if (!el.closest(".hero, .hero-co")) io.observe(el); });
      $$(".mz").forEach(el => io.observe(el));
      $$(".portrait, .ab-card, .st-flow").forEach(el => io.observe(el));
      $$(".wk").forEach(el => io.observe(el));
      const cio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { count(e.target); cio.unobserve(e.target); } }), { threshold: .5 });
      $$("[data-count]").forEach(el => cio.observe(el));
    } else { $$(".st-flow, .split, .mz, .portrait, .ab-card, .wk").forEach(e => e.classList.add("in")); $$("[data-count]").forEach(count); }

    function count(el) {
      const end = +el.dataset.count, suf = el.dataset.suffix || ""; let t0 = null;
      if (reduce) { el.textContent = end + suf; return; }
      const f = t => { if (t0 === null) t0 = t; const p = Math.min(1, (t - t0) / 1500); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(f); };
      requestAnimationFrame(f);
    }

    // menu
    const menu = $("#menu"), mb = $("#menuBtn");
    const setMenu = o => { menu.classList.toggle("open", o); document.body.classList.toggle("lock", o); mb.setAttribute("aria-expanded", o); };
    mb.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
    menu.addEventListener("click", e => { if (e.target.closest("a,button")) setMenu(false); });

    // buttons + links
    $$("[data-share]").forEach(b => b.addEventListener("click", () => P.share(D)));
    document.addEventListener("click", e => {
      const need = e.target.closest && e.target.closest("[data-need]");
      if (need) { e.preventDefault(); P.toast("This link isn't set yet. Add it to links in the DATA block."); return; }
      const cp = e.target.closest && e.target.closest("[data-copy]");
      if (cp) { e.preventDefault(); const u = cp.dataset.copy; if (u) P.copy(new URL(u, location.href).href.replace(/\.html$/, ""), "Portfolio link copied"); else P.toast("This link isn't set yet. Add it to links in the DATA block."); }
    });

    // contact form: sending lives in assets/footer.js, shared by every page

    // works: filters, modal
    $$(".filters .chip").forEach(c => c.addEventListener("click", () => {
      if (c.classList.contains("on")) return;
      const apply = () => {
        $$(".filters .chip").forEach(x => x.classList.toggle("on", x === c));
        $$("#rows .wk").forEach(r => { r.hidden = c.dataset.f !== "All" && r.dataset.cat !== c.dataset.f; if (!r.hidden) r.classList.add("in"); });
        P.layoutWorks();
      };
      if (document.startViewTransition && !reduce) document.startViewTransition(apply); else apply();
    }));
    P.worksFx();
    P.aboutArtFx();
    const modal = $("#modal");
    if (!P.onOpen) P.onOpen = k => P.openWork(D, +k);
    modal.addEventListener("click", e => { if (e.target === modal || e.target.closest(".m-close")) modal.close ? modal.close() : modal.removeAttribute("open"); });
    document.addEventListener("click", e => { const c = e.target.closest && e.target.closest("[data-open]"); if (c) P.onOpen(c.dataset.open); });
    document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.open != null) { e.preventDefault(); P.onOpen(e.target.dataset.open); } });

    // pointer: cursor, peek, magnetic buttons
    const cur = $("#cur"), peek = $("#peek");
    let mx = 0, my = 0, cx = 0, cy = 0, px = 0, py = 0, rot = 0;
    if (fine && !reduce) {
      document.addEventListener("pointermove", e => {
        mx = e.clientX; my = e.clientY; cur.classList.add("on");
        const t = e.target instanceof Element ? e.target : null;
        const row = t && t.closest(".row"), dc = t && t.closest("[data-cursor]"), mg = t && t.closest(".mag");
        if (row) {
          if (row._shown !== true) { peek.innerHTML = P.art(row.dataset.k, +row.dataset.tone, +row.dataset.seed); row._shown = true; }
          peek.classList.add("on");
        } else peek.classList.remove("on");
        $$("#rows .row").forEach(r => { if (r !== row) r._shown = false; });
        cur.classList.toggle("big", !!dc);
        if (dc) cur.firstElementChild.textContent = dc.dataset.cursor;
        $$(".mag").forEach(b => { if (b !== mg) b.style.translate = ""; });
        if (mg) { const r = mg.getBoundingClientRect(); mg.style.translate = `${((e.clientX - r.left) / r.width - .5) * 14}px ${((e.clientY - r.top) / r.height - .5) * 10}px`; }
      }, { passive: true });
      document.addEventListener("pointerleave", () => { cur.classList.remove("on"); peek.classList.remove("on"); });
      (function loop() {
        cx += (mx - cx) * .25; cy += (my - cy) * .25;
        cur.style.transform = `translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
        const pw = peek.offsetWidth, ph = peek.offsetHeight;
        const tx = Math.min(mx + 28, innerWidth - pw - 16), ty = Math.min(Math.max(my - ph / 2, 80), innerHeight - ph - 16);
        rot += (Math.max(-10, Math.min(10, (tx - px) * .25)) - rot) * .2;
        px += (tx - px) * .16; py += (ty - py) * .16;
        peek.style.transform = `translate3d(${px.toFixed(1)}px,${py.toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg)`;
        requestAnimationFrame(loop);
      })();
    }

    // hero figure: gentle parallax toward the cursor
    const heroFig = $(".hero .fig, .hero-co .fig");
    if (heroFig && !reduce) {
      let fpx = 0, fpy = 0, ftx = 0, fty = 0;
      const heroSec = heroFig.closest(".hero, .hero-co");
      if (fine) {
        document.addEventListener("pointermove", e => {
          const r = heroSec.getBoundingClientRect();
          if (e.clientY < r.top || e.clientY > r.bottom) { ftx = 0; fty = 0; return; }
          ftx = ((e.clientX - r.left) / r.width - .5) * 22;
          fty = ((e.clientY - r.top) / r.height - .5) * 12;
        }, { passive: true });
      }
      (function loop() {
        fpx += (ftx - fpx) * .06; fpy += (fty - fpy) * .06;
        heroFig.style.setProperty("--px", fpx.toFixed(1) + "px");
        heroFig.style.setProperty("--py", fpy.toFixed(1) + "px");
        requestAnimationFrame(loop);
      })();
    }

    // nav colour follows the section underneath it
    const navEl = $(".nav");
    const navTone = () => {
      const open = menu.classList.contains("open");
      const els = document.elementsFromPoint(innerWidth / 2, 60);
      const inv = open || els.some(e => e.closest && e.closest(".dark, .violet") && !e.closest(".nav, .menu, .loader"));
      const vio = !open && els.some(e => e.closest && e.closest(".violet") && !e.closest(".nav, .menu, .loader"));
      navEl.classList.toggle("inv", inv);
      navEl.classList.toggle("vio", vio);
      if ($(".h3")) navEl.classList.toggle("top", scrollY < 30 && !open);
    };
    mb.addEventListener("click", () => setTimeout(navTone, 20));
    menu.addEventListener("click", () => setTimeout(navTone, 20));

    // scroll: statement highlight + hero parallax
    const stEl = $("#st"), ws = stEl ? $$(".w", stEl) : [], hw = $("#hword");
    let ticking = false;
    const onScroll = () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        if (stEl) {
          const r = stEl.getBoundingClientRect(), vh = innerHeight;
          const p = Math.min(1, Math.max(0, (vh * .88 - r.top) / (r.height + vh * .3)));
          const n = Math.round(p * ws.length);
          ws.forEach((w, i) => w.classList.toggle("on", i < n));
        }
        if (hw && scrollY < innerHeight * 1.2 && !reduce) hw.style.translate = `0 ${(scrollY * .16).toFixed(1)}px`;
        navTone();
        ticking = false;
      });
    };
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  };

  return P;
})();

</script>
<script>
/* =====================================================================
   EDIT ME. Everything on this page comes from this DATA object.
   links: the published web addresses of the three portfolios.
   photo / heroPhoto: paste an image URL or data: URI (heroPhoto works best
   as a transparent PNG cut-out).
   ===================================================================== */
const DATA = {
  self: "developer",
  title: "Zain Faisal | daizn studio",
  name: "Zain Faisal",
  email: "zainfaisal089@gmail.com",

<script>
/* nav pill: a highlight that glides to the hovered link, resting on the current page's link if it has one */
(function () {
  const box = document.querySelector(".links"); if (!box) return;
  const links = Array.from(box.querySelectorAll("a")), ind = document.createElement("span");
  ind.className = "nav-ind"; box.prepend(ind); box.classList.add("js");
  let hover = null, last = null;
  const cur = () => links.find(a => a.classList.contains("active")) || null;
  function place() {
    const a = hover || cur(); links.forEach(l => l.classList.toggle("on", l === a));
    if (!a) { ind.classList.remove("show"); return; }
    ind.style.width = a.offsetWidth + "px"; ind.style.transform = "translateX(" + a.offsetLeft + "px)"; ind.classList.add("show");
  }
  links.forEach(a => {
    a.addEventListener("mouseenter", () => { hover = a; place(); });
    a.addEventListener("focus", () => { hover = a; place(); });
    a.addEventListener("blur", () => { hover = null; place(); });
  });
  box.addEventListener("mouseleave", () => { hover = null; place(); });
  new MutationObserver(() => { const c = cur(); if (c !== last) { last = c; place(); } }).observe(box, { subtree: true, attributes: true, attributeFilter: ["class"] });
  addEventListener("resize", place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  place();
})();
</script>
